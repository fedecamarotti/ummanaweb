<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienestar | Ummana</title>
<meta name="description" content="Yoga, meditación y tai chi en Ummana. Reservá tu clase de prueba sin cargo.">
<link rel="icon" href="/images/logobeige.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2b28;
    --ink-soft:#5c5c56;
    --sand:#b9b8a5;
    --sand-deep:#9a9985;
    --paper:#ffffff;
    --cream:#f3eeea;
    --hairline:rgba(43,43,40,0.12);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    font-family:'Montserrat',sans-serif;
    color:var(--ink);
    background:var(--paper);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}

  /* ---------- HEADER ---------- */

  header{
    position:fixed;
    top:0;left:0;right:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 48px;
    transition:padding .4s ease, background .4s ease;
  }

  header.scrolled{
    padding:14px 48px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    box-shadow:0 1px 0 var(--hairline);
  }

  .logo-img{
    height:36px;
    width:auto;
    display:block;
    transition:height .4s ease;
  }

  header.scrolled .logo-img{height:30px;}

  .back-link{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:0.14em;
    font-weight:500;
    color:var(--paper);
    border:1px solid rgba(255,255,255,0.55);
    padding:9px 20px 9px 16px;
    border-radius:2px;
    transition:all .35s ease;
  }

  .back-link svg{width:13px;height:13px;display:block;}

  header.scrolled .back-link{
    color:var(--ink);
    border-color:var(--ink);
  }

  .back-link:hover{
    background:var(--paper);
    color:var(--ink);
  }

  header.scrolled .back-link:hover{
    background:var(--ink);
    color:var(--paper);
  }

  /* ---------- HERO ---------- */

  .hero{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    min-height:560px;
    background:#cfcfc9;
    overflow:hidden;
  }

  .hero-media{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.42) 100%);
    pointer-events:none;
  }

  .hero-words{
    position:absolute;
    z-index:2;
    left:0;right:0;
    bottom:clamp(36px, 9vh, 84px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(16px, 3vw, 34px);
    padding:0 20px;
    color:var(--paper);
    text-shadow:0 2px 16px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.35);
  }

  .hero-word{
    font-size:clamp(15px, 2vw, 21px);
    font-weight:400;
    letter-spacing:0.14em;
    white-space:nowrap;
    padding:8px 2px;
    animation:wordFloat 4.2s ease-in-out infinite;
    transition:opacity .25s ease;
  }

  .hero-word:nth-of-type(2){animation-delay:.7s;}
  .hero-word:nth-of-type(3){animation-delay:1.4s;}

  .hero-word:hover{opacity:0.7;}

  .hero-bar{
    width:1px;
    height:clamp(16px, 2.2vw, 22px);
    background:rgba(255,255,255,0.7);
    flex:0 0 auto;
  }

  @keyframes wordFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }

  /* ---------- BLOQUES ---------- */

  .blocks{
    background:var(--paper);
    padding:70px 24px 90px;
    display:flex;
    flex-direction:column;
    gap:56px;
  }

  .block{
    position:relative;
    width:100%;
    max-width:980px;
    margin:0 auto;
    background:var(--cream);
    border-top:3px solid var(--sand);
    border-radius:4px;
    padding:34px 46px 30px;
    display:flex;
    flex-direction:column;
    gap:16px;
    box-shadow:0 20px 60px rgba(43,43,40,0.08);
    scroll-margin-top:84px;
  }

  .block-eyebrow{
    display:block;
    font-size:11.5px;
    letter-spacing:0.2em;
    font-weight:700;
    color:var(--sand-deep);
    margin-bottom:4px;
  }

  .block-intro{
    font-size:14px;
    line-height:1.7;
    color:var(--ink-soft);
  }

  .block-divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:2px 0;
  }

  .block-divider::before,
  .block-divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--hairline);
  }

  .block-divider span{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--sand);
    display:block;
  }

  .pro-row{
    position:relative;
    margin:0 -46px;
    padding:0 46px;
  }

  .pro{
    display:flex;
    align-items:center;
    gap:28px;
    transition:opacity .4s ease, transform .4s ease;
  }

  .pro.no-transition{transition:none;}
  .pro.offset-left{opacity:0;transform:translateX(-22px);}
  .pro.offset-right{opacity:0;transform:translateX(22px);}

  .pro-photo-wrap{
    position:relative;
    flex:0 0 340px;
    aspect-ratio:4/3;
    border-radius:6px;
    overflow:hidden;
    background:#e7e6df;
    box-shadow:0 14px 34px rgba(43,43,40,0.14);
  }

  .pro-photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .6s ease;
  }

  .pro-photo-wrap:hover img{transform:scale(1.06);}

  .photo-placeholder{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#e7e6df;
    color:#9a9985;
    font-size:11px;
    letter-spacing:0.16em;
    font-weight:600;
  }

  .carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:26px;
    height:26px;
    border-radius:50%;
    background:#e4d9c8;
    border:1px solid rgba(154,153,133,0.4);
    color:var(--ink-soft);
    display:none;
    align-items:center;
    justify-content:center;
    padding:0;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
    animation:arrowPulse 2.6s ease-in-out infinite;
    z-index:2;
  }

  .carousel-arrow svg{width:13px;height:13px;display:block;}

  .carousel-arrow:hover{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
    animation:none;
    transform:translateY(-50%) scale(1);
  }

  @keyframes arrowPulse{
    0%, 100%{ transform:translateY(-50%) scale(1); }
    50%{ transform:translateY(-50%) scale(1.1); }
  }

  .carousel-arrow.prev{left:12px;}
  .carousel-arrow.next{right:12px;}
  .pro-row.has-multiple .carousel-arrow{display:flex;}

  .pro-bio h3{
    font-size:17px;
    font-weight:700;
    margin-bottom:4px;
    color:var(--ink);
    position:relative;
    display:inline-block;
    padding-bottom:10px;
  }

  .pro-bio h3::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:34px;
    height:2px;
    background:var(--sand);
  }

  .pro-bio p{
    margin-top:10px;
    font-size:12.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }

  .marquee-wrap{
    overflow:hidden;
    padding:14px 0;
    border-top:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline);
  }

  .marquee-track{
    display:flex;
    gap:12px;
    width:max-content;
    animation:marquee 26s linear infinite;
  }

  .marquee-wrap:hover .marquee-track{animation-play-state:paused;}

  @keyframes marquee{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  .chip{
    flex:0 0 auto;
    font-size:11.5px;
    letter-spacing:0.02em;
    color:var(--ink);
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(43,43,40,0.14);
    padding:8px 16px;
    border-radius:20px;
    white-space:nowrap;
  }

  .block-cta{
    text-align:center;
    padding-top:14px;
  }

  .block-cta-accent{
    width:34px;
    height:2px;
    background:var(--sand);
    margin:0 auto 14px;
  }

  .block-cta-line{
    font-size:13.5px;
    line-height:1.9;
    color:var(--ink-soft);
  }

  .btn-write{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.08em;
    font-weight:500;
    color:var(--paper);
    background:var(--ink);
    padding:7px 16px;
    margin-top:6px;
    border-radius:20px;
    transition:background .25s ease;
  }

  .btn-write:hover{background:var(--sand-deep);}

  /* ---------- WHATSAPP FLOAT ---------- */

  .whatsapp-float{
    position:fixed;
    bottom:28px;
    right:28px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#4FBE82;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    z-index:200;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .whatsapp-float:hover{
    transform:scale(1.08);
    box-shadow:0 10px 28px rgba(0,0,0,0.28);
  }

  .whatsapp-float svg{
    width:28px;
    height:28px;
    fill:#fff;
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width:900px){
    header{padding:20px 24px;}
    header.scrolled{padding:14px 24px;}
    .pro{flex-direction:column;}
    .pro-photo-wrap{flex-basis:auto;width:100%;}
  }

  @media (max-width:680px){
    .logo-img{height:28px;}
    .hero-words{bottom:112px;}
    .back-link{font-size:10.5px;padding:8px 14px 8px 11px;}
    .blocks{padding:48px 16px 80px;gap:40px;}
    .block{padding:28px 24px 26px;}
    .pro-row{margin:0 -24px;padding:0 24px;}
    .carousel-arrow.prev{left:6px;}
    .carousel-arrow.next{right:6px;}
  }

  @media (prefers-reduced-motion:reduce){
    .hero-word{animation:none;}
    .marquee-track{animation:none;}
    .carousel-arrow{animation:none;}
  }
</style>
</head>

<!-- ============================================================
     SEGUIMIENTO DE CONVERSIONES (Google Ads)
     Completar con los datos de la acción de conversión:
       ADS_ID    -> por ejemplo "AW-123456789"
       ADS_LABEL -> por ejemplo "AbC-D_efG-h12"
     Mientras estén vacíos no se carga ningún tag ni se mide nada.
     Todo elemento con la clase "cta-track" cuenta como conversión al hacer clic.
     ============================================================ -->
<script>
  const ADS_ID = "";
  const ADS_LABEL = "";
  const WHATSAPP_PHONE = "5491139208108";

  if (ADS_ID){
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ADS_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', ADS_ID);
  }

  function waLink(text){
    return 'https://api.whatsapp.com/send?phone=' + WHATSAPP_PHONE + '&text=' + encodeURIComponent(text);
  }

  // Un único listener para todos los botones de llamado a la acción
  document.addEventListener('click', (e) => {
    const cta = e.target.closest('.cta-track');
    if (!cta) return;
    if (window.gtag && ADS_ID && ADS_LABEL){
      gtag('event', 'conversion', { send_to: ADS_ID + '/' + ADS_LABEL });
    }
  });
</script>

      </div>
      <div>
        <div class="marquee-wrap"><div class="marquee-track">${chipsHTML}${chipsHTML}</div></div>
        <div class="block-cta">
          <div class="block-cta-accent"></div>
          <p class="block-cta-line">
            ${CTA_TEXT}<br>
            <a class="btn-write cta-track" href="${waLink(data.waText)}" target="_blank" rel="noopener">escribinos</a>
          </p>
        </div>
      </div>
    `;
    container.appendChild(section);

    setupCarousel(section, data);
  });

  /* ---------- CARRUSEL (mismo comportamiento que el desplegable) ---------- */
  function setupCarousel(section, data){
    const pro = section.querySelector('.pro');
    const photo = section.querySelector('.pro-photo-wrap img');
    const placeholder = section.querySelector('.photo-placeholder');
    const nameEl = section.querySelector('.pro-bio h3');
    const bioEl = section.querySelector('.pro-bio p');
    const prevBtn = section.querySelector('.carousel-arrow.prev');
    const nextBtn = section.querySelector('.carousel-arrow.next');
    let index = 0;
    let timer = null;
    let visible = false;

    data.items.forEach(p => { if (p.photo){ const pre = new Image(); pre.src = p.photo; } });

    function render(){
      const p = data.items[index];
      if (p.photo){
        photo.style.display = '';
        photo.src = p.photo;
        photo.alt = p.name;
        placeholder.style.display = 'none';
      } else {
        photo.style.display = 'none';
        photo.removeAttribute('src');
        placeholder.style.display = 'flex';
      }
      nameEl.textContent = p.name;
      bioEl.innerHTML = p.bio;
    }

    function change(direction){
      if (data.items.length <= 1) return;
      const leaveClass = direction === 1 ? 'offset-left' : 'offset-right';
      const enterClass = direction === 1 ? 'offset-right' : 'offset-left';
      pro.classList.add(leaveClass);
      setTimeout(() => {
        index = (index + direction + data.items.length) % data.items.length;
        render();
        pro.classList.add('no-transition');
        pro.classList.remove(leaveClass);
        pro.classList.add(enterClass);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            pro.classList.remove('no-transition');
            pro.classList.remove(enterClass);
          });
        });
      }, 400);
    }

    function startAuto(){
      clearInterval(timer);
      if (data.items.length > 1 && visible){
        timer = setInterval(() => change(1), 15000);
      }
    }

    prevBtn.addEventListener('click', () => { change(-1); startAuto(); });
    nextBtn.addEventListener('click', () => { change(1); startAuto(); });

    // el avance automático solo corre mientras el bloque está en pantalla
    new IntersectionObserver(entries => {
      visible = entries[0].isIntersecting;
      if (visible) startAuto(); else clearInterval(timer);
    }, { threshold: 0.25 }).observe(section);

    render();
  }

  /* ---------- BOTÓN FLOTANTE DE WHATSAPP ---------- */
  const waFloat = document.getElementById('whatsappFloat');
  waFloat.href = waLink(waFloat.dataset.waText);
</script>
