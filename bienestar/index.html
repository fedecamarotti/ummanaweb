<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienestar | Ummana</title>
<meta name="description" content="Yoga, meditación y tai chi en Ummana. Reservá tu clase de prueba sin cargo.">
<link rel="icon" href="../images/logobeige.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2b28;
    --ink-soft:#5c5c56;
    --sand:#b9b8a5;
    --sand-deep:#9a9985;
    --paper:#ffffff;
    --cream:#f3eeea;
    --hairline:rgba(43,43,40,0.12);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    font-family:'Montserrat',sans-serif;
    color:var(--ink);
    background:var(--paper);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}

  /* ---------- HEADER ---------- */

  header{
    position:fixed;
    top:0;left:0;right:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 48px;
    transition:padding .4s ease, background .4s ease;
  }

  header.scrolled{
    padding:14px 48px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    box-shadow:0 1px 0 var(--hairline);
  }

  .logo-wrap{
    position:relative;
    display:block;
    height:36px;
    transition:height .4s ease;
  }

  .logo-img{
    height:100%;
    width:auto;
    display:block;
    transition:opacity .4s ease;
  }

  .logo-img.logo-beige{
    position:absolute;
    top:0;left:0;
    opacity:0;
  }

  header.scrolled .logo-wrap{height:30px;}
  header.scrolled .logo-img.logo-white{opacity:0;}
  header.scrolled .logo-img.logo-beige{opacity:1;}

  .back-link{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:0.14em;
    font-weight:500;
    color:var(--paper);
    border:1px solid rgba(255,255,255,0.55);
    padding:9px 20px 9px 16px;
    border-radius:2px;
    transition:all .35s ease;
  }

  .back-link svg{width:13px;height:13px;display:block;}

  header.scrolled .back-link{
    color:var(--ink);
    border-color:var(--ink);
  }

  .back-link:hover{
    background:var(--paper);
    color:var(--ink);
  }

  header.scrolled .back-link:hover{
    background:var(--ink);
    color:var(--paper);
  }

  /* ---------- HERO ---------- */

  .hero{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    min-height:560px;
    background:#cfcfc9;
    overflow:hidden;
  }

  .hero-media{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.38) 100%),
      rgba(58,48,38,0.34);
    pointer-events:none;
  }

  .hero-words{
    position:absolute;
    z-index:2;
    left:0;right:0;
    bottom:clamp(36px, 9vh, 84px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(16px, 3vw, 34px);
    padding:0 20px;
    color:var(--paper);
    text-shadow:0 2px 16px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.35);
  }

  .hero-word{
    font-size:clamp(15px, 2vw, 21px);
    font-weight:400;
    letter-spacing:0.14em;
    white-space:nowrap;
    padding:8px 2px;
    animation:wordFloat 4.2s ease-in-out infinite;
    transition:opacity .25s ease;
  }

  .hero-word:nth-of-type(2){animation-delay:.7s;}
  .hero-word:nth-of-type(3){animation-delay:1.4s;}

  .hero-word:hover{opacity:0.7;}

  .hero-bar{
    width:1px;
    height:clamp(16px, 2.2vw, 22px);
    background:rgba(255,255,255,0.7);
    flex:0 0 auto;
  }

  @keyframes wordFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }

  /* ---------- BLOQUES (franjas a todo el ancho) ---------- */

  .band{
    width:100%;
    padding:96px 24px 80px;
    scroll-margin-top:60px;
  }

  .band.beige{background:var(--cream);}
  .band.white{background:var(--paper);}

  .band-inner{
    max-width:1080px;
    margin:0 auto;
  }

  .band-title{
    font-size:clamp(26px, 3.2vw, 34px);
    font-weight:500;
    letter-spacing:0.04em;
    color:var(--ink);
    position:relative;
    display:inline-block;
    padding-bottom:14px;
    margin-bottom:18px;
  }

  .band-title::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:44px;
    height:2px;
    background:var(--sand);
  }

  .band-intro{
    font-size:15px;
    line-height:1.8;
    color:var(--ink-soft);
    max-width:860px;
  }

  .styles{
    display:flex;
    flex-direction:column;
    gap:64px;
    margin-top:56px;
  }

  .style-row{
    display:flex;
    align-items:center;
    gap:56px;
  }

  .style-row.reverse{flex-direction:row-reverse;}

  .style-photo{
    position:relative;
    flex:0 0 46%;
    aspect-ratio:4/3;
    border-radius:6px;
    overflow:hidden;
    background:#e7e6df;
    box-shadow:0 14px 34px rgba(43,43,40,0.14);
  }

  .style-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .6s ease;
  }

  .style-photo:hover img{transform:scale(1.05);}

  .photo-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e7e6df;
    color:#9a9985;
    font-size:11px;
    letter-spacing:0.16em;
    font-weight:600;
  }

  .style-text{flex:1 1 auto;}

  .style-text h3{
    font-size:21px;
    font-weight:700;
    color:var(--ink);
    position:relative;
    display:inline-block;
    padding-bottom:12px;
    margin-bottom:6px;
  }

  .style-text h3::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:34px;
    height:2px;
    background:var(--sand);
  }

  .style-text p{
    margin-top:12px;
    font-size:14px;
    line-height:1.8;
    color:var(--ink-soft);
  }

  .band-foot{margin-top:60px;}

  .marquee-wrap{
    overflow:hidden;
    padding:14px 0;
    border-top:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline);
  }

  .marquee-track{
    display:flex;
    gap:12px;
    width:max-content;
    animation:marquee 26s linear infinite;
  }

  .marquee-wrap:hover .marquee-track{animation-play-state:paused;}

  @keyframes marquee{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  .chip{
    flex:0 0 auto;
    font-size:11.5px;
    letter-spacing:0.02em;
    color:var(--ink);
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(43,43,40,0.14);
    padding:8px 16px;
    border-radius:20px;
    white-space:nowrap;
  }

  .band-cta{
    text-align:center;
    padding-top:26px;
  }

  .band-cta-accent{
    width:34px;
    height:2px;
    background:var(--sand);
    margin:0 auto 14px;
  }

  .band-cta-line{
    font-size:13.5px;
    line-height:1.9;
    color:var(--ink-soft);
  }

  .btn-write{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.08em;
    font-weight:500;
    color:var(--paper);
    background:var(--ink);
    padding:7px 16px;
    margin-top:6px;
    border-radius:20px;
    transition:background .25s ease;
  }

  .btn-write:hover{background:var(--sand-deep);}

  /* ---------- WHATSAPP FLOAT ---------- */

  .whatsapp-float{
    position:fixed;
    bottom:28px;
    right:28px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#4FBE82;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    z-index:200;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .whatsapp-float:hover{
    transform:scale(1.08);
    box-shadow:0 10px 28px rgba(0,0,0,0.28);
  }

  .whatsapp-float svg{
    width:28px;
    height:28px;
    fill:#fff;
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width:900px){
    header{padding:20px 24px;}
    header.scrolled{padding:14px 24px;}
    .style-row,
    .style-row.reverse{flex-direction:column;gap:28px;align-items:stretch;}
    .style-photo{flex-basis:auto;width:100%;}
    .styles{gap:52px;}
  }

  @media (max-width:680px){
    .logo-wrap{height:28px;}
    header.scrolled .logo-wrap{height:26px;}
    .hero-words{bottom:112px;}
    .back-link{font-size:10.5px;padding:8px 14px 8px 11px;}
    .band{padding:72px 20px 64px;}
  }

  @media (prefers-reduced-motion:reduce){
    .hero-word{animation:none;}
    .marquee-track{animation:none;}
  }
</style>
</head>
<body>

<header id="siteHeader">
  <a class="logo-wrap" href="./" aria-label="Ummana">
    <img src="../images/logoblanco.png" alt="Ummana" class="logo-img logo-white">
    <img src="../images/logobeige.png" alt="" class="logo-img logo-beige">
  </a>
  <a class="back-link" href="../" aria-label="Ir a la página de inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    INICIO
  </a>
</header>

<section class="hero">
  <img src="../images/salon.webp" alt="Salón de Ummana" class="hero-media">
  <div class="hero-words">
    <a class="hero-word" href="#yoga">Yoga</a>
    <span class="hero-bar"></span>
    <a class="hero-word" href="#meditacion">Meditación</a>
    <span class="hero-bar"></span>
    <a class="hero-word" href="#tai-chi">Tai Chi</a>
  </div>
</section>

<main id="blocks"></main>

<a class="whatsapp-float cta-track" id="whatsappFloat" data-wa-text="Hola! Quiero reservar una clase de prueba sin cargo" href="#" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 2C6.486 2 2 6.486 2 12.004c0 1.98.548 3.876 1.584 5.53L2 22l4.606-1.549A9.96 9.96 0 0 0 12.004 22C17.522 22 22 17.522 22 12.004 22 6.486 17.522 2 12.004 2zm0 18.111a8.09 8.09 0 0 1-4.13-1.129l-.296-.176-3.088 1.038 1.05-3.014-.192-.309a8.09 8.09 0 0 1-1.24-4.317c0-4.474 3.64-8.114 8.114-8.114 4.474 0 8.114 3.64 8.114 8.114 0 4.474-3.64 8.114-8.114 8.114z"/></svg>
</a>

<!-- ============================================================
     SEGUIMIENTO DE CONVERSIONES (Google Ads)
     Completar con los datos de la acción de conversión:
       ADS_ID    -> por ejemplo "AW-123456789"
       ADS_LABEL -> por ejemplo "AbC-D_efG-h12"
     Mientras estén vacíos no se carga ningún tag ni se mide nada.
     Todo elemento con la clase "cta-track" cuenta como conversión al hacer clic.
     ============================================================ -->
<script>
  const ADS_ID = "";
  const ADS_LABEL = "";
  const WHATSAPP_PHONE = "5491139208108";

  if (ADS_ID){
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ADS_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', ADS_ID);
  }

  function waLink(text){
    return 'https://api.whatsapp.com/send?phone=' + WHATSAPP_PHONE + '&text=' + encodeURIComponent(text);
  }

  // Un único listener para todos los botones de llamado a la acción
  document.addEventListener('click', (e) => {
    const cta = e.target.closest('.cta-track');
    if (!cta) return;
    if (window.gtag && ADS_ID && ADS_LABEL){
      gtag('event', 'conversion', { send_to: ADS_ID + '/' + ADS_LABEL });
    }
  });
</script>

<script>
  /* ---------- HEADER SCROLL STATE ---------- */
  const header = document.getElementById('siteHeader');
  function updateHeader(){ header.classList.toggle('scrolled', window.scrollY > 40); }
  window.addEventListener('scroll', updateHeader, { passive: true });
  updateHeader();

  /* ---------- CONTENIDO (mismo texto que los desplegables del sitio principal) ---------- */
  const CTA_TEXT = "Si querés reservar tu<br><strong>clase de prueba sin cargo</strong>";

  const blocksData = [
    {
      id: "yoga",
      bg: "beige",
      title: "Yoga",
      waText: "Hola! Quiero reservar una clase de prueba sin cargo de Yoga",
      intro: "<strong>Un espacio para conectar con tu cuerpo, tu respiración y tu mente, a tu propio ritmo</strong>. A través de clases presenciales y grupos reducidos, el yoga combina movimiento, fuerza, flexibilidad y respiración para favorecer el equilibrio físico y mental. Las prácticas ayudan a reducir el estrés, mejorar la concentración y cultivar mayor calma y bienestar, en un entorno cuidado y accesible para todos los niveles, incluso sin experiencia previa. <strong>Contamos con distintos estilos:</strong>",
      items: [
        {
          photo: "../images/ashtanga.webp",
          name: "Ashtanga Yoga",
          bio: "<strong>Práctica dinámica basada en una serie fija de posturas que se repite en cada clase, coordinando movimiento y respiración.</strong> La repetición permite profundizar progresivamente en la práctica y desarrollar fuerza, flexibilidad, concentración y presencia. Con el tiempo, la secuencia puede convertirse en una verdadera meditación en movimiento: intensa, profunda y transformadora.<br><br>Instructores: <strong>Pedro Barbieri, Eugenia Ferreti</strong>"
        },
        {
          photo: null,
          name: "Yoga Suave",
          bio: "<strong>Práctica pensada para quienes buscan moverse desde la calma y la sutileza, con especial atención a la respiración, la movilidad y el descanso.</strong> Los movimientos se adaptan a las posibilidades de cada persona, favoreciendo una experiencia accesible y consciente. Es ideal para personas mayores, con movilidad reducida o para quienes desean comenzar a practicar yoga de manera gradual y sin exigencias.<br><br>Instructoras: <strong>Laura Marelli, Paula Origone</strong>"
        },
        {
          photo: "../images/hatha.webp",
          name: "Hatha Yoga",
          bio: "<strong>Práctica que invita a sostener y profundizar las posturas (asanas), trabajando especialmente la alineación, la estabilidad y la conciencia corporal.</strong> Se combinan posturas, respiración y concentración, utilizando elementos que pueden facilitar o intensificar la práctica según las necesidades de cada persona. Ideal para desarrollar fuerza, flexibilidad y presencia de manera progresiva.<br><br>Instructora: <strong>Ana Crupi</strong>"
        }
      ],
      chips: [
        "Mejora la flexibilidad y la fuerza física",
        "Reduce el estrés y la ansiedad",
        "Favorece la concentración y la calma mental",
        "Conecta respiración y movimiento",
        "Es apto para todos los niveles, incluso sin experiencia previa"
      ]
    },
    {
      id: "meditacion",
      bg: "white",
      title: "Meditación",
      waText: "Hola! Quiero reservar una clase de prueba sin cargo de Meditación",
      intro: "<strong>Un espacio para bajar el ritmo, aquietar la mente y volver a conectar con vos mismo/a.</strong> La meditación propone momentos de pausa, respiración y atención plena, sin exigencias ni apuro, para cultivar mayor presencia y calma en el día a día. Los encuentros son presenciales, en grupos reducidos y en un ambiente cálido y de confianza, con prácticas de una hora pensadas para acompañarte a encontrar equilibrio y bienestar.",
      items: [
        {
          photo: "../images/meditacion.webp",
          name: "¿Qué hacemos en cada encuentro?",
          bio: "<strong>Meditación sentada:</strong> Una práctica guiada para aquietar la mente y conectar con el presente.<br><strong>Lectura y reflexión:</strong> Un momento para integrar la enseñanza y abrir el diálogo grupal.<br><strong>Cierre con té grupal:</strong> Un espacio cálido para compartir experiencias, aprendizajes y generar vínculos.<br><br>Instructora: <strong>Lic. Mariela Herrero</strong>"
        }
      ],
      chips: [
        "Disminuye el estrés y la ansiedad",
        "Favorece el descanso y mejora la calidad del sueño",
        "Aumenta la concentración y la claridad mental",
        "Brinda calma emocional y resiliencia",
        "Ayuda a integrar hábitos conscientes en la vida cotidiana"
      ]
    },
    {
      id: "tai-chi",
      bg: "beige",
      title: "Tai Chi Chuan",
      waText: "Hola! Quiero reservar una clase de prueba sin cargo de Tai Chi",
      intro: "<strong>Práctica ancestral de origen marcial que combina movimientos suaves y fluidos, respiración consciente y concentración.</strong> El Tai Chi Chuan invita a conectar cuerpo, mente y respiración a través de secuencias realizadas con calma y presencia. Más que una práctica física, es un camino hacia el equilibrio y el bienestar integral, que favorece la movilidad, la coordinación, la relajación y una mayor conciencia corporal.",
      items: [
        {
          photo: "../images/taichi.webp",
          name: "¿Por qué practicar Taichi?",
          bio: "<strong>El Taichi conecta cuerpo y mente a través del movimiento, la respiración y la atención plena</strong>, ayudándote a encontrar mayor equilibrio, calma y presencia en el día a día. Es una práctica accesible para todas las edades y niveles, no requiere experiencia previa y se adapta al ritmo de cada persona, favoreciendo la movilidad, la coordinación y el bienestar integral.<br><br>Instructor: <strong>Maxi Labombarda</strong>"
        }
      ],
      chips: [
        "Reduce el estrés y la ansiedad",
        "Mejora el equilibrio y la coordinación",
        "Aumenta la flexibilidad y fortalece las articulaciones",
        "Favorece la circulación y la energía vital",
        "Desarrolla el enfoque y la concentración"
      ]
    }
  ];

  /* ---------- ARMADO DE LAS FRANJAS ---------- */
  const container = document.getElementById('blocks');

  blocksData.forEach((data, i) => {
    const chipsHTML = data.chips.map(t => `<span class="chip">${t}</span>`).join('');

    const rowsHTML = data.items.map((p, idx) => {
      // las franjas con varios estilos alternan el lado de la foto: izquierda, derecha, izquierda
      const reverse = idx % 2 === 1 ? ' reverse' : '';
      const photoHTML = p.photo
        ? `<img src="${p.photo}" alt="${p.name}" loading="lazy">`
        : `<div class="photo-placeholder">FOTO PROFESIONAL</div>`;
      return `
        <div class="style-row${reverse}">
          <div class="style-photo">${photoHTML}</div>
          <div class="style-text">
            <h3>${p.name}</h3>
            <p>${p.bio}</p>
          </div>
        </div>`;
    }).join('');

    const section = document.createElement('section');
    section.className = 'band ' + (data.bg === 'white' ? 'white' : 'beige');
    section.id = data.id;
    section.innerHTML = `
      <div class="band-inner">
        <h2 class="band-title">${data.title}</h2>
        <p class="band-intro">${data.intro}</p>
        <div class="styles">${rowsHTML}</div>
        <div class="band-foot">
          <div class="marquee-wrap"><div class="marquee-track">${chipsHTML}${chipsHTML}</div></div>
          <div class="band-cta">
            <div class="band-cta-accent"></div>
            <p class="band-cta-line">
              ${CTA_TEXT}<br>
              <a class="btn-write cta-track" href="${waLink(data.waText)}" target="_blank" rel="noopener">escribinos</a>
            </p>
          </div>
        </div>
      </div>
    `;
    container.appendChild(section);
  });

  /* ---------- BOTÓN FLOTANTE DE WHATSAPP ---------- */
  const waFloat = document.getElementById('whatsappFloat');
  waFloat.href = waLink(waFloat.dataset.waText);
</script>

</body>
</html>
