<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bienestar | Ummana</title>
<meta name="description" content="Yoga, meditación y tai chi en Ummana. Reservá tu clase de prueba sin cargo.">
<link rel="icon" href="../images/logobeige.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2b28;
    --ink-soft:#5c5c56;
    --sand:#b9b8a5;
    --sand-deep:#9a9985;
    --paper:#ffffff;
    --cream:#f3eeea;
    --hairline:rgba(43,43,40,0.12);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    font-family:'Montserrat',sans-serif;
    color:var(--ink);
    background:var(--paper);
    font-weight:400;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;}

  /* ---------- HEADER ---------- */

  header{
    position:fixed;
    top:0;left:0;right:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 48px;
    transition:padding .4s ease, background .4s ease;
  }

  header.scrolled{
    padding:14px 48px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(10px);
    box-shadow:0 1px 0 var(--hairline);
  }

  .logo-wrap{
    position:relative;
    display:block;
    height:36px;
    transition:height .4s ease;
  }

  .logo-img{
    height:100%;
    width:auto;
    display:block;
    transition:opacity .4s ease;
  }

  .logo-img.logo-beige{
    position:absolute;
    top:0;left:0;
    opacity:0;
  }

  header.scrolled .logo-wrap{height:30px;}
  header.scrolled .logo-img.logo-white{opacity:0;}
  header.scrolled .logo-img.logo-beige{opacity:1;}

  .back-link{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    letter-spacing:0.14em;
    font-weight:500;
    color:var(--paper);
    border:1px solid rgba(255,255,255,0.55);
    padding:9px 20px 9px 16px;
    border-radius:2px;
    transition:all .35s ease;
  }

  .back-link svg{width:13px;height:13px;display:block;}

  header.scrolled .back-link{
    color:var(--ink);
    border-color:var(--ink);
  }

  .back-link:hover{
    background:var(--paper);
    color:var(--ink);
  }

  header.scrolled .back-link:hover{
    background:var(--ink);
    color:var(--paper);
  }

  /* ---------- HERO ---------- */

  .hero{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    min-height:560px;
    background:#cfcfc9;
    overflow:hidden;
  }

  .hero-media{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 24%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.38) 100%),
      rgba(58,48,38,0.34);
    pointer-events:none;
  }

  .hero-words{
    position:absolute;
    z-index:2;
    left:0;right:0;
    bottom:clamp(36px, 9vh, 84px);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(16px, 3vw, 34px);
    padding:0 20px;
    color:var(--paper);
    text-shadow:0 2px 16px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.35);
  }

  .hero-word{
    font-size:clamp(15px, 2vw, 21px);
    font-weight:400;
    letter-spacing:0.14em;
    white-space:nowrap;
    padding:8px 2px;
    animation:wordFloat 4.2s ease-in-out infinite;
    transition:opacity .25s ease;
  }

  .hero-word:nth-of-type(2){animation-delay:.7s;}
  .hero-word:nth-of-type(3){animation-delay:1.4s;}

  .hero-word:hover{opacity:0.7;}

  .hero-bar{
    width:1px;
    height:clamp(16px, 2.2vw, 22px);
    background:rgba(255,255,255,0.7);
    flex:0 0 auto;
  }

  @keyframes wordFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }

  /* ---------- BLOQUES (franjas a todo el ancho) ---------- */

  .band{
    width:100%;
    padding:26px 0 0;
    scroll-margin-top:61px;
  }

  .band.beige{background:var(--cream);}
  .band.white{background:var(--paper);}

  .band-inner{
    max-width:1128px;
    margin:0 auto;
    padding:0 24px;
  }

  .band-title{
    font-size:clamp(26px, 3.2vw, 34px);
    font-weight:500;
    letter-spacing:0.04em;
    color:var(--ink);
    position:relative;
    display:inline-block;
    padding-bottom:14px;
    margin-bottom:18px;
  }

  .band-title::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:44px;
    height:2px;
    background:var(--sand);
  }

  .band-intro{
    font-size:15px;
    line-height:1.8;
    color:var(--ink-soft);
  }

  .styles{
    display:flex;
    flex-direction:column;
    gap:64px;
    margin-top:56px;
  }

  .style-row{
    display:flex;
    align-items:center;
    gap:56px;
  }

  .style-row.reverse{flex-direction:row-reverse;}

  .style-photo{
    position:relative;
    flex:0 0 46%;
    aspect-ratio:4/3;
    border-radius:6px;
    overflow:hidden;
    background:#e7e6df;
    box-shadow:0 14px 34px rgba(43,43,40,0.14);
  }

  .style-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .6s ease;
  }

  .style-photo:hover img{transform:scale(1.05);}

  .photo-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e7e6df;
    color:#9a9985;
    font-size:11px;
    letter-spacing:0.16em;
    font-weight:600;
  }

  .style-text{flex:1 1 auto;}

  .style-text h3{
    font-size:21px;
    font-weight:700;
    color:var(--ink);
    position:relative;
    display:inline-block;
    padding-bottom:12px;
    margin-bottom:6px;
  }

  .style-text h3::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:34px;
    height:2px;
    background:var(--sand);
  }

  .style-text p{
    margin-top:12px;
    font-size:14px;
    line-height:1.8;
    color:var(--ink-soft);
  }

  .band-foot{margin-top:60px;margin-bottom:44px;}

  .marquee-wrap{
    overflow:hidden;
    padding:14px 0;
    border-top:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline);
  }

  .marquee-track{
    display:flex;
    gap:12px;
    width:max-content;
    animation:marquee 26s linear infinite;
  }

  .marquee-wrap:hover .marquee-track{animation-play-state:paused;}

  @keyframes marquee{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  .chip{
    flex:0 0 auto;
    font-size:11.5px;
    letter-spacing:0.02em;
    color:var(--ink);
    background:rgba(255,255,255,0.7);
    border:1px solid rgba(43,43,40,0.14);
    padding:8px 16px;
    border-radius:20px;
    white-space:nowrap;
  }

  /* franja oscura del llamado a la acción */
  .cta-strip{
    background:#262624;
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .cta-strip-text{
    font-size:14px;
    line-height:1.5;
    letter-spacing:0.01em;
    color:#fff;
  }

  .cta-strip-text strong{font-weight:600;}

  .btn-strip{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.08em;
    font-weight:600;
    color:#262624;
    background:#fff;
    padding:8px 22px;
    border-radius:20px;
    transition:background .25s ease;
  }

  .btn-strip:hover{background:var(--cream);}

  /* ---------- WHATSAPP FLOAT ---------- */

  .whatsapp-float{
    position:fixed;
    bottom:28px;
    right:28px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:#4FBE82;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    z-index:200;
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  }

  .whatsapp-float:hover{
    transform:scale(1.08);
    box-shadow:0 10px 28px rgba(0,0,0,0.28);
  }

  .whatsapp-float svg{
    width:28px;
    height:28px;
    fill:#fff;
  }

  /* ---------- RESPONSIVE ---------- */

  @media (max-width:900px){
    header{padding:20px 24px;}
    header.scrolled{padding:14px 24px;}
    .style-row,
    .style-row.reverse{flex-direction:column;gap:28px;align-items:stretch;}
    .style-photo{flex-basis:auto;width:100%;}
    .styles{gap:52px;}
  }

  .slider-dots{display:none;}

  /* flechas del carrusel de estilos: solo se usan en el celular */
  .m-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(243,238,234,0.94);
    border:1px solid rgba(154,153,133,0.55);
    color:var(--ink);
    display:none;
    align-items:center;
    justify-content:center;
    padding:0;
    box-shadow:0 4px 14px rgba(0,0,0,0.22);
    animation:mArrowPulse 2.6s ease-in-out infinite;
    z-index:2;
  }

  .m-arrow svg{width:16px;height:16px;display:block;}
  .m-arrow.prev{left:10px;}
  .m-arrow.next{right:10px;}

  @keyframes mArrowPulse{
    0%, 100%{ transform:translateY(-50%) scale(1); }
    50%{ transform:translateY(-50%) scale(1.1); }
  }

  @media (max-width:680px){
    /* espaciado pensado para el celular */
    .band{scroll-margin-top:58px;padding:21px 0 0;}
    .band-inner{padding:0 20px;}
    .band-title{font-size:28px;padding-bottom:12px;margin-bottom:14px;}
    .band-intro{font-size:14px;line-height:1.7;}
    .styles{margin-top:26px;}

    /* cada estilo: título, subrayado, foto y después la descripción */
    .style-row,
    .style-row.reverse{gap:0;align-items:stretch;}
    .style-text{display:contents;}
    .style-text h3{order:1;align-self:flex-start;font-size:20px;padding-bottom:11px;margin-bottom:0;}
    .style-photo{order:2;margin-top:14px;box-shadow:0 8px 20px rgba(43,43,40,0.12);}
    .style-text p{order:3;margin-top:16px;font-size:14px;line-height:1.7;}

    .marquee-wrap{padding:12px 0;}
    .cta-strip{flex-direction:column;gap:10px;padding:16px 16px 18px;}
    .cta-strip-text{font-size:13px;text-align:center;}
    .btn-strip{font-size:13px;padding:9px 26px;}

    .whatsapp-float{width:52px;height:52px;bottom:18px;right:16px;}
    .whatsapp-float svg{width:26px;height:26px;}

    /* puntos: indican cuántos estilos hay y cuál se está viendo */
    .band.multi .slider-dots{
      display:flex;
      gap:8px;
      margin-top:20px;
    }
    .slider-dots button{
      width:8px;
      height:8px;
      padding:0;
      border-radius:50%;
      background:rgba(154,153,133,0.4);
      transition:background .25s ease, transform .25s ease;
    }
    .slider-dots button.active{
      background:var(--sand-deep);
      transform:scale(1.25);
    }

    /* la franja de beneficios queda a la distancia de una línea en blanco del instructor */
    .band-foot{margin-top:31px;margin-bottom:26px;}

    /* estilos de Yoga: se deslizan con el dedo o con las flechas */
    .band.multi .styles{
      flex-direction:row;
      gap:0;
      overflow-x:auto;
      overflow-y:hidden;
      scroll-snap-type:x mandatory;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      align-items:flex-start;
      transition:height .3s ease;
    }
    .band.multi .styles::-webkit-scrollbar{display:none;}
    .band.multi .style-row{
      flex:0 0 100%;
      min-width:0;
      scroll-snap-align:start;
      scroll-snap-stop:always;
    }
    .band.multi .m-arrow{display:flex;}
    .band.multi .style-photo{box-shadow:none;}

    .logo-wrap{height:28px;}
    header.scrolled .logo-wrap{height:26px;}
    .hero-words{bottom:112px;}
    .back-link{font-size:10.5px;padding:8px 14px 8px 11px;}
  }

  @media (prefers-reduced-motion:reduce){
    .hero-word{animation:none;}
    .marquee-track{animation:none;}
    .m-arrow{animation:none;}
  }
</style>
</head>

<!-- ============================================================
     SEGUIMIENTO DE CONVERSIONES (Google Ads)
     Completar con los datos de la acción de conversión:
       ADS_ID    -> por ejemplo "AW-123456789"
       ADS_LABEL -> por ejemplo "AbC-D_efG-h12"
     Mientras estén vacíos no se carga ningún tag ni se mide nada.
     Todo elemento con la clase "cta-track" cuenta como conversión al hacer clic.
     ============================================================ -->
<script>
  const ADS_ID = "";
  const ADS_LABEL = "";
  const WHATSAPP_PHONE = "5491139208108";

  if (ADS_ID){
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + ADS_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', ADS_ID);
  }

  function waLink(text){
    return 'https://api.whatsapp.com/send?phone=' + WHATSAPP_PHONE + '&text=' + encodeURIComponent(text);
  }

  // Un único listener para todos los botones de llamado a la acción
  document.addEventListener('click', (e) => {
    const cta = e.target.closest('.cta-track');
    if (!cta) return;
    if (window.gtag && ADS_ID && ADS_LABEL){
      gtag('event', 'conversion', { send_to: ADS_ID + '/' + ADS_LABEL });
    }
  });
</script>

      title: "Tai Chi Chuan",
      waText: "Hola! Quiero reservar una clase de prueba sin cargo de Tai Chi",
      intro: "<strong>Práctica ancestral de origen marcial que combina movimientos suaves y fluidos, respiración consciente y concentración.</strong> El Tai Chi Chuan invita a conectar cuerpo, mente y respiración a través de secuencias realizadas con calma y presencia. Más que una práctica física, es un camino hacia el equilibrio y el bienestar integral, que favorece la movilidad, la coordinación, la relajación y una mayor conciencia corporal.",
      items: [
        {
          photo: "../images/taichi.webp",
          name: "¿Por qué practicar Taichi?",
          bio: "<strong>El Taichi conecta cuerpo y mente a través del movimiento, la respiración y la atención plena</strong>, ayudándote a encontrar mayor equilibrio, calma y presencia en el día a día. Es una práctica accesible para todas las edades y niveles, no requiere experiencia previa y se adapta al ritmo de cada persona, favoreciendo la movilidad, la coordinación y el bienestar integral.<br><br>Instructor: <strong>Maxi Labombarda</strong>"
        }
      ],
      chips: [
        "Reduce el estrés y la ansiedad",
        "Mejora el equilibrio y la coordinación",
        "Aumenta la flexibilidad y fortalece las articulaciones",
        "Favorece la circulación y la energía vital",
        "Desarrolla el enfoque y la concentración"
      ]
    }
  ];

  const ARROW_PREV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  const ARROW_NEXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  /* ---------- ARMADO DE LAS FRANJAS ---------- */
  const container = document.getElementById('blocks');

  blocksData.forEach((data, i) => {
    const chipsHTML = data.chips.map(t => `<span class="chip">${t}</span>`).join('');

    const multiple = data.items.length > 1;
    const arrowsHTML = multiple
      ? `<button class="m-arrow prev" aria-label="Estilo anterior">${ARROW_PREV}</button><button class="m-arrow next" aria-label="Estilo siguiente">${ARROW_NEXT}</button>`
      : '';

    const rowsHTML = data.items.map((p, idx) => {
      // las franjas con varios estilos alternan el lado de la foto: izquierda, derecha, izquierda
      const reverse = idx % 2 === 1 ? ' reverse' : '';
      const photoHTML = p.photo
        ? `<img src="${p.photo}" alt="${p.name}" loading="lazy">`
        : `<div class="photo-placeholder">FOTO PROFESIONAL</div>`;
      return `
        <div class="style-row${reverse}">
          <div class="style-photo">${photoHTML}${arrowsHTML}</div>
          <div class="style-text">
            <h3>${p.name}</h3>
            <p>${p.bio}</p>
          </div>
        </div>`;
    }).join('');

    const section = document.createElement('section');
    section.className = 'band ' + (data.bg === 'white' ? 'white' : 'beige') + (multiple ? ' multi' : '');
    section.id = data.id;
    section.innerHTML = `
      <div class="band-inner">
        <h2 class="band-title">${data.title}</h2>
        <p class="band-intro">${data.intro}</p>
        <div class="styles">${rowsHTML}</div>
        <div class="band-foot">
          <div class="marquee-wrap"><div class="marquee-track">${chipsHTML}${chipsHTML}</div></div>
        </div>
      </div>
      <div class="cta-strip">
        <p class="cta-strip-text">${CTA_TEXT}</p>
        <a class="btn-strip cta-track" href="${waLink(data.waText)}" target="_blank" rel="noopener">escribinos</a>
      </div>
    `;
    container.appendChild(section);

    if (multiple) setupMobileSlider(section);
  });

  /* ---------- DESLIZADOR DE ESTILOS (solo celular) ---------- */
  function setupMobileSlider(section){
    const track = section.querySelector('.styles');
    const rows = [...track.querySelectorAll('.style-row')];
    const mq = window.matchMedia('(max-width:680px)');
    let index = 0;

    const dots = document.createElement('div');
    dots.className = 'slider-dots';
    dots.innerHTML = rows.map((_, i) => `<button aria-label="Ir al estilo ${i + 1}"></button>`).join('');
    track.parentNode.insertBefore(dots, track);
    const dotBtns = [...dots.querySelectorAll('button')];
    dotBtns.forEach((d, i) => d.addEventListener('click', () => goTo(i)));
    function paintDots(){ dotBtns.forEach((d, i) => d.classList.toggle('active', i === index)); }

    // la altura sigue al estilo visible, así la franja de beneficios queda pegada al instructor
    function fitHeight(){
      if (!mq.matches){ track.style.height = ''; return; }
      track.style.height = rows[index].offsetHeight + 'px';
    }

    function currentIndex(){
      return Math.max(0, Math.min(rows.length - 1, Math.round(track.scrollLeft / track.clientWidth)));
    }

    function goTo(i){
      const target = (i + rows.length) % rows.length;
      track.scrollTo({ left: target * track.clientWidth, behavior: 'smooth' });
    }

    let ticking = false;
    track.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const i = currentIndex();
        if (i !== index){ index = i; fitHeight(); paintDots(); }
      });
    }, { passive: true });

    section.querySelectorAll('.m-arrow.prev').forEach(b => b.addEventListener('click', () => goTo(currentIndex() - 1)));
    section.querySelectorAll('.m-arrow.next').forEach(b => b.addEventListener('click', () => goTo(currentIndex() + 1)));

    const ro = new ResizeObserver(fitHeight);
    rows.forEach(r => ro.observe(r));
    mq.addEventListener('change', () => { track.scrollLeft = 0; index = 0; fitHeight(); paintDots(); });
    fitHeight();
    paintDots();
  }

  /* ---------- BOTÓN FLOTANTE DE WHATSAPP ---------- */
  const waFloat = document.getElementById('whatsappFloat');
  waFloat.href = waLink(waFloat.dataset.waText);
</script>
